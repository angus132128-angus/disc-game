<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DISC GAME - คำถาม</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: linear-gradient(135deg, #eefdf8, #eaf8ff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 520px;

            background: white;

            border-radius: 28px;

            padding: 30px;

            box-shadow: 0 15px 50px rgba(0, 80, 100, 0.15);

            text-align: center;
        }

        .quiz-logo img {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        .quiz-title {
            font-size: 28px;
            font-weight: bold;
            color: #008fa8;

            margin-bottom: 25px;
        }

        .progress-info {
            font-size: 15px;
            color: #60777c;

            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;

            background: #e5eeee;

            border-radius: 10px;

            overflow: hidden;

            margin-bottom: 25px;
        }

        .progress-fill {
            width: 10%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #00a88f,
                #008fc4
            );
        }

        .category {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 20px;

            background: #eef9f7;

            color: #008f83;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .question-section h1 {
            font-size: 23px;

            line-height: 1.6;

            color: #243f45;

            margin-bottom: 25px;
        }

        .answers {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .answer-button {
            width: 100%;

            padding: 16px;

            border: 2px solid #e4eeee;

            border-radius: 15px;

            background: white;

            cursor: pointer;

            text-align: left;

            font-size: 16px;

            color: #304e54;

            display: flex;

            align-items: center;

            gap: 14px;
        }

        .answer-button:hover {
            border-color: #00a88f;

            background: #f4fffc;
        }
        .answer-button.selected {
    border-color: #00a88f;

    background: #e9fff8;

    box-shadow:
        0 5px 15px rgba(0, 168, 143, 0.15);

    transform: translateY(-2px);
}


.answer-button.selected .answer-letter {
    background: #00a88f;

    color: white;
}

        .answer-letter {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #eef8f7;

            color: #008f83;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            flex-shrink: 0;
        }

        .quiz-navigation {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        .quiz-navigation button {
            flex: 1;

            padding: 13px;

            border-radius: 13px;

            font-size: 15px;

            cursor: pointer;
        }

        .previous-button {
            border: 1px solid #d8e5e5;

            background: #f5f8f8;

            color: #718084;
        }

        .next-button {
            border: none;

            background: #008fa8;

            color: white;

            font-weight: bold;
        }

        .previous-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        @media (max-width: 480px) {

            .game-container {
                padding: 22px 18px;
            }

            .question-section h1 {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>

    <main class="game-container">


        <!-- LOGO -->

        <div class="quiz-logo">

            <img
                src="assets/logo.png"
                alt="THEFAST GROUP"
            >

        </div>


        <!-- TITLE -->

        <div class="quiz-title">

            🎮 DISC GAME

        </div>


        <!-- PROGRESS -->

        <div class="progress-info">

            ข้อที่ 1 / 10

        </div>


        <div class="progress-bar">

            <div class="progress-fill"></div>

        </div>


        <!-- CATEGORY -->

        <div class="category">

            🧩 คำถามที่ 1

        </div>


        <!-- QUESTION -->

        <section class="question-section">

            <h1>

                เวลาต้องทำงานร่วมกับคนอื่น
                คุณมักจะ…

            </h1>

        </section>


        <!-- ANSWERS -->

        <section class="answers">


    <button
        class="answer-button"
        onclick="selectAnswer('A', this)"
    >

        <span class="answer-letter">
            A
        </span>

        <span>
            เป็นคนตัดสินใจ
        </span>

    </button>


    <button
        class="answer-button"
        onclick="selectAnswer('B', this)"
    >

        <span class="answer-letter">
            B
        </span>

        <span>
            เป็นคนสร้างบรรยากาศ
        </span>

    </button>


    <button
        class="answer-button"
        onclick="selectAnswer('C', this)"
    >

        <span class="answer-letter">
            C
        </span>

        <span>
            เป็นคนช่วยเหลือ
        </span>

    </button>


    <button
        class="answer-button"
        onclick="selectAnswer('D', this)"
    >

        <span class="answer-letter">
            D
        </span>

        <span>
            เป็นคนวางแผน
        </span>

    </button>


</section>

        <!-- BUTTONS -->

        <div class="quiz-navigation">

            <button
    class="previous-button"
    onclick="previousQuestion()"
    disabled
>
    ← ย้อนกลับ
</button>


            <button
    class="next-button"
    onclick="nextQuestion()"
>
    ถัดไป →
</button>

        </div>


    </main>
    <script>

    let currentQuestion = 0;

    let answers = [];


    const questions = [

        {
            question:
                "เวลาต้องทำงานร่วมกับคนอื่น คุณมักจะ…",

            options: [
                "เป็นคนตัดสินใจ",
                "เป็นคนสร้างบรรยากาศ",
                "เป็นคนช่วยเหลือ",
                "เป็นคนวางแผน"
            ]
        },


        {
            question:
                "เมื่อเจอปัญหา",

            options: [
                "รีบแก้ทันที",
                "ขอความคิดเห็นจากคนอื่น",
                "ค่อย ๆ คิด",
                "วิเคราะห์ข้อมูลก่อน"
            ]
        },


        {
            question:
                "คนรอบตัวมักพูดว่าคุณ",

            options: [
                "กล้าได้กล้าเสีย",
                "สนุก คุยเก่ง",
                "ใจดี",
                "ละเอียด"
            ]
        },


        {
            question:
                "เวลาทำงาน",

            options: [
                "ชอบการแข่งขัน",
                "ชอบพบผู้คน",
                "ชอบความมั่นคง",
                "ชอบระบบ"
            ]
        },


        {
            question:
                "คุณไม่ชอบ",

            options: [
                "ความล่าช้า",
                "ความเงียบ",
                "ความขัดแย้ง",
                "ความผิดพลาด"
            ]
        },


        {
            question:
                "เวลาประชุม",

            options: [
                "พูดตรง ๆ",
                "พูดเยอะ",
                "ฟังมากกว่าพูด",
                "ถามรายละเอียด"
            ]
        },


        {
            question:
                "คุณภูมิใจที่สุดเมื่อ",

            options: [
                "ชนะ",
                "ได้รับการยอมรับ",
                "คนอื่นมีความสุข",
                "งานออกมาสมบูรณ์"
            ]
        },


        {
            question:
                "เมื่อต้องเริ่มงานใหม่",

            options: [
                "ลุยเลย",
                "ตื่นเต้น",
                "ขอเวลาปรับตัว",
                "ศึกษาก่อน"
            ]
        },


        {
            question:
                "เวลาถูกกดดัน",

            options: [
                "ยิ่งฮึด",
                "ระบายกับคนอื่น",
                "เงียบลง",
                "คิดมากขึ้น"
            ]
        },


        {
            question:
                "คนแบบไหนที่คุณทำงานด้วยแล้วสบายใจ",

            options: [
                "คนเก่ง",
                "คนอารมณ์ดี",
                "คนจริงใจ",
                "คนมีเหตุผล"
            ]
        }

    ];


    function showQuestion() {

        const question =
            questions[currentQuestion];


        document.querySelector(
            ".progress-info"
        ).textContent =
            "ข้อที่ " +
            (currentQuestion + 1) +
            " / " +
            questions.length;


        document.querySelector(
            ".question-section h1"
        ).textContent =
            question.question;


        const buttons =
            document.querySelectorAll(
                ".answer-button"
            );


        buttons.forEach(
            function(button, index) {

                button.querySelector(
                    "span:last-child"
                ).textContent =
                    question.options[index];


                button.classList.remove(
                    "selected"
                );

            }
        );


        if (
            answers[currentQuestion]
        ) {

            const answerIndex =
                answers[currentQuestion]
                .charCodeAt(0) - 65;


            buttons[answerIndex]
                .classList.add("selected");

        }


        const progress =
            (
                (currentQuestion + 1)
                /
                questions.length
            ) * 100;


        document.querySelector(
            ".progress-fill"
        ).style.width =
            progress + "%";


        document.querySelector(
            ".category"
        ).textContent =
            "🧩 คำถามที่ " +
            (currentQuestion + 1);


        const previousButton =
            document.querySelector(
                ".previous-button"
            );


        previousButton.disabled =
            currentQuestion === 0;


        const nextButton =
            document.querySelector(
                ".next-button"
            );


        if (
            currentQuestion ===
            questions.length - 1
        ) {

            nextButton.textContent =
                "ดูผลลัพธ์ →";

        } else {

            nextButton.textContent =
                "ถัดไป →";

        }

    }


    function selectAnswer(
        answer,
        button
    ) {

        answers[currentQuestion] =
            answer;


        const buttons =
            document.querySelectorAll(
                ".answer-button"
            );


        buttons.forEach(
            function(btn) {

                btn.classList.remove(
                    "selected"
                );

            }
        );


        button.classList.add(
            "selected"
        );


        console.log(
            "คำตอบทั้งหมด:",
            answers
        );

    }


    function finishQuiz() {

    let scores = {
        D: 0,
        I: 0,
        S: 0,
        C: 0
    };

    answers.forEach(function(answer) {

        if (answer === "A") {
            scores.D++;
        }

        if (answer === "B") {
            scores.I++;
        }

        if (answer === "C") {
            scores.S++;
        }

        if (answer === "D") {
            scores.C++;
        }

    });

    console.log("คำตอบ:", answers);

localStorage.setItem(
    "discScores",
    JSON.stringify(scores)
);

localStorage.setItem(
    "discAnswers",
    JSON.stringify(answers)
);

window.location.href = "result.html";
}


function nextQuestion() {

    if (!answers[currentQuestion]) {

        alert("กรุณาเลือกคำตอบก่อนค่ะ");

        return;

    }

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();

    } else {

        finishQuiz();

    }

}


    function previousQuestion() {

        if (
            currentQuestion > 0
        ) {

            currentQuestion--;

            showQuestion();

        }

    }


    showQuestion();

</script>

</body>

</html>
